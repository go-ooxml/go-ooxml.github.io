baseURL = "https://go-ooxml.github.io/"
title = "go-ooxml"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# The design -- layouts/partials/styles.html, theme-toggle.html,
# fork-ribbon.html and icons/{github,book}.html -- comes from the shared Hugo
# module github.com/go-fleettools/landingkit, not from copies here: the copies
# drifted. Its version is pinned in go.mod (Renovate bumps it), and kit.go
# keeps `go mod tidy` from deleting that requirement. A file of the same name
# under layouts/partials/ would silently override the module's.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

# The architectures the test suite RUNS on, which is what the page says. Both
# modules here are pure Go with no build tags, so the list is the one the CI
# matrix actually runs rather than the one it compiles for.
[params]
  arches = ["amd64", "arm64", "riscv64", "loong64", "ppc64le", "s390x"]

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 15.99:1, bright on the dark background 3.07:1.
  base = "#1e1b4b"
  deep = "#12102e"
  bright = "#4f46e5"
  shadow = "rgba(30,27,75,.7)"
  glow = "rgba(30,27,75,.6)"
  wash = "rgba(30,27,75,.10)"
  washDeep = "rgba(18,16,46,.06)"
  chipBg = "#eae9fc"
  chipBorder = "#cac8f7"
  chipFg = "#12102e"
  chipBgDark = "rgba(79,70,229,.14)"
  chipBorderDark = "rgba(79,70,229,.32)"
  chipFgDark = "#9e99f1"
  statsEnd = "#d5d3f9"
  bandText = "#e3e1fb"

[[params.repos]]
  name = "opc"
  pkg = "github.com/go-ooxml/opc"
  url = "https://github.com/go-ooxml/opc"
  status = "ready"
  blurb = "**The Open Packaging Conventions** — the ZIP, the content types and the relationships that `.docx`, `.xlsx`, `.pptx` and `.xps` are all built on, read *and written*. ⛔ Nothing here is found by its path: the main part of a package is reached through a **relationship**, and measured on three files LibreOffice wrote in the same minute the one relationship type that names it points at three different places. A bomb is measured rather than feared — 8 638 bytes expanding to 8 MiB, **971:1** — so every limit has a number beside it. No dependencies outside the standard library."

[[params.repos]]
  name = "ooxml"
  pkg = "github.com/go-ooxml/ooxml"
  url = "https://github.com/go-ooxml/ooxml"
  status = "ready"
  blurb = "**Word, Excel and PowerPoint into [richdoc](https://github.com/go-richdoc/richdoc), and Word, Excel and PowerPoint back out** — a `.pptx` as one picture per slide with its speaker notes, the way `marp-cli --pptx` writes one. ⛔ One container, three vocabularies — the opposite of ODF, where one vocabulary spans every kind of document — which is why there are three readers and not one. A heading is a paragraph wearing a style; a cell's value is usually not in the cell but in a shared strings table; DrawingML carries its formatting as attributes where WordprocessingML uses elements. The writer is the fleet's first: it defines its heading styles rather than relying on the latent ones only Word has, and where LibreOffice is installed the tests **ask it**, because a package our own reader is delighted with can be one Word refuses. **`ooxml/xlsx` writes typed workbooks** — numbers, shared strings, booleans, dates as serials, `Decimal(n)` and `Percent(n)` formats, column widths, a bold header with a frozen pane — and ⛔ **never a formula**: `=SUM(A1)` stays text, with `quotePrefix` so an edit in Excel keeps it so. Judged by LibreOffice and openpyxl, not only by our own reader."
